# Recalcula os sinais a cada 15 minutos chamando /api/cron do site na Vercel.
# Precisa de dois secrets no repositorio (Settings > Secrets and variables > Actions):
#   SITE_URL    ex.: https://robotrader.vercel.app  (sem barra no final)
#   CRON_SECRET o mesmo valor cadastrado na Vercel
# O GitHub pode atrasar execucoes agendadas em alguns minutos; o cron diario da Vercel (00:10 UTC) fica de reserva.
name: Recalcular sinais

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: recalcular
  cancel-in-progress: false

jobs:
  recalcular:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/cron
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os secrets SITE_URL e CRON_SECRET"; exit 1
          fi
          curl -fsS --max-time 60 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron" | head -c 400
